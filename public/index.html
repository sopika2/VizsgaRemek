<!DOCTYPE html>
<html lang="hu">

<head>
  <title>Gondozóház - SZ6-B</title>
  <meta   charset="utf-8">
  <meta   name="viewport" content="width=device-width, initial-scale=1">
  <link   href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link   rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link   href="style.css" rel="stylesheet">
  <script src="common_gondozohaz.js"></script>
</head>

<script type="text/javascript">
  /*-----------------------------*/
  $(document).ready(function() {
      ajax_get( "banner.html", '#main1');
      session_get();                                                      // frissítés után is látszódjon, ki van bejelentkezve

      $("#login1_modal_button").click(function() { login_show();  });
      $("#user1_login_button").click(function()  { login();       });
      $("#user1_logout_button").click(function() { logout();      });
      $("#user1_form input").keydown(function(e) { if (e.key === "Enter") { login(); } });
      $("#menu1_button").click(function()        { $('#menu1_card').fadeToggle(300); });
      $("#main1").on("click", ".btn-get-started", function() { login_show(); });   // banner "Login" gomb
      $(document).keydown(function (e) {
          if (e.keyCode === 113) {  $("#menu1_card").fadeToggle(300); }       // F2: menü
          if (e.keyCode === 119) {  login_show(); }                           // F8: login
      });

      $('#menu1_ul').html( menu_generator() );    /* common_gondozohaz.js menu_json tömb feltöltése */

      $("#menu1_ul").on("click", "li.xmenu", function ()                      // így az újragenerált menüre is működik
      {
          var id = $(this).attr("id");                            // pl: "menu1_5"
          var i = id.substring(6);                                // balról vág: pl: "5" --> id="menu1_
          var tip = menü_json[i].tip;
          var url = menü_json[i].url;
          if (tip == 0) { ajax_get( url, '#main1'); }             // ajax html betöltése
          if (tip == 1) {window.open(url, '').focus();  }         // teljes oldal
          if (tip == 2) {window.open(url, '_blank').focus();  }   // new tab
          $("#menu1_card").fadeToggle(300);
      });
  });

  /* ---------- login-logout modális ablak ---------  */
  function login_show()
  {
    $('#login1_modal').modal('show');
  }

  /* --- a bejelentkezett user neve az id=login1_user TAG-be (null: senki) --- */
  function user_kiir(user)
  {
    $("#login1_user").html(user ? user.NEV : "Login: még senki..." );
    $('#login1_user').prop('title', user ? `[${user.EMAIL}] ${user.JOGOSULTSAG}` : "[...]");
  }

  async function session_get()
  {
    var json = await ajax_getjson("session");
    if (json) { user_kiir(json.user); }
  }

  /* --- felhasználó bejelentkezik --- */
  async function login()
  {
    var json = await ajax_post("login", { login: $("#user1_login_field").val(), jelszo: $("#user1_passwd_field").val() });
    if (json) {
        user_kiir(json.user);
        $("#user1_passwd_field").val("");
        $('#login1_modal').modal('hide');
        mySend({text:`Bejelentkezett: ${json.user.NEV}!`, tip:"success", mp:3});
    }
  }

  /* ---- felhasználó kijelentkezik ---- */
  function logout()
  {
    myQuestion({text: `Kijelentkezés megerősítése...? `, ok: async function() {
        var json = await ajax_post("logout");
        if (json) { mySend({text:json.message, tip:"info", mp:3}); }
        user_kiir(null);
        $('#login1_modal').modal('hide');
    }});
  }

</script>

<body class="d-flex flex-column vh-100 m-0">

  <!-- -------------------------- fejléc és menü ----------------------------------------- -->
  <div class="fejléc d-flex align-items-center gap-2 p-2 text-white">
    <button id="menu1_button" type="button" class="btn btn-secondary bi bi-list dropdown-toggle" title="menü (F2)"></button>
    <h4 class="my-auto">Gondozóház</h4>
    <span class="navbar-text my-auto">SZ6-B</span>
    <span id="login1_user" class="navbar-text my-auto ms-auto text-truncate d-none d-sm-inline" title="[...]">Login: még senki...</span>
    <button id="login1_modal_button" type="button" class="btn btn-secondary bi bi-person-fill ms-auto ms-sm-0" title="login (F8)"></button>
  </div>

  <!-- -------------------------- konténer  ----------------------------------------- -->
  <div id="main1" class="flex-grow-1 overflow-auto">                      <!-- menu_json tip=0 URL kerül ide -->
  </div>

  <div class="lábléc p-2 text-white text-center small">
    Gondozóház SZ6-B | Csány László Technikum - 2026.
  </div>

  <!-- -------------------------- login / logout modális ablak -------------------------------------- -->
  <div class="modal fade" id="login1_modal" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="opacity: 0.9;">
      <div class="modal-content">
        <div class="modal-header bg-secondary text-white">
          <h3 class="modal-title">Bejelentkezés / Kijelentkezés</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="user1_form">
              <div class="mb-3" >
                <label for="user1_login_field" class="form-label">Felhasználó:</label>
                <input type="text" class="form-control" id="user1_login_field" name="user1_login_field" placeholder="email" autocomplete="username">
              </div>
              <div class="mb-3">
                <label for="user1_passwd_field" class="form-label">Jelszó:</label>
                <input type="password" class="form-control" id="user1_passwd_field" name="user1_passwd_field" placeholder="Jelszó" autocomplete="current-password">
              </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" id="user1_login_button"  class="button login">Login</button>
            <button type="button" id="user1_logout_button" class="button logout">Logout</button>
        </div>
      </div>
    </div>
  </div>

   <!-- --------------------------menü card -------------------------------------- -->
   <div class="card" id="menu1_card">
    <div class="card-header"><h6>Menü</h6></div>
    <div class="card-body">
      <ul class="xmenu" id="menu1_ul">  <!-- menu_generator() tölti fel! -->  </ul>
    </div>
    <div class="card-footer"><i>© Csány szoft. - 2026</i></div>
  </div>

  <div class="loader" id="loader1"><img src="images/ajaxloader3.gif" alt="loader"/></div>      <!-- ajax loader -->
</body>
</html>
